<!-- Navigation -->
<header x-data="{ mobileMenuOpen: false }" class="relative z-50 px-6 lg:px-20 py-6 border-b border-slate-200 dark:border-slate-800 backdrop-blur-md bg-white/5">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-primary/10 rounded-lg">
                <span class="material-symbols-outlined text-primary text-2xl">terminal</span>
            </div>
            <a href="{% url 'home' %}" class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-accent">
                Jeff Darick
            </a>
        </div>
        
        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-10">
            <a class="text-sm font-medium hover:text-primary transition-colors {% if request.resolver_match.url_name == 'home' %}text-primary{% endif %}" href="{% url 'home' %}">Home</a>
            <a class="text-sm font-medium hover:text-primary transition-colors {% if request.resolver_match.url_name == 'about' %}text-primary{% endif %}" href="{% url 'about' %}">About</a>
            <a class="text-sm font-medium hover:text-primary transition-colors {% if request.resolver_match.url_name == 'experience' %}text-primary{% endif %}" href="{% url 'experience' %}">Experience</a>
            <a class="text-sm font-medium hover:text-primary transition-colors {% if request.resolver_match.url_name == 'blog' %}text-primary{% endif %}" href="{% url 'blog' %}">Blog</a>
            <a class="text-sm font-medium hover:text-primary transition-colors {% if request.resolver_match.url_name == 'contact' %}text-primary{% endif %}" href="{% url 'contact' %}">Contact</a>
        </nav>

        <div class="flex items-center gap-4">
            <a href="{% url 'contact' %}" class="hidden sm:inline-block px-6 py-2 bg-primary hover:bg-primary/90 text-white text-sm font-bold rounded-lg shadow-lg shadow-primary/20 transition-all">
                Hire Me
            </a>
            <div class="hidden sm:block h-10 w-10 rounded-full border border-primary/30 bg-cover bg-center" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAaOFsIAFjK1HUX8Q_95nhPuut9S6hpfRlq6WtM_yNCFerTV3gNggb5ZehOhwAZRQznzo_oWidyTTg2HxttuTvkRwB74MZtxum2-gppaIjXZ0Ojt7YBqpEA6fnqe0qgYR0UGeDLVnOGv5_O3So9anFipW6OxsStP3U781_uW2UneFPPgKacQTkRx-gQD3U8KfIR8_MoWoW_0skkRIUoBeyTKetq7aeZr-XmChMEKHQlQLR_FFG7yRQr-h9-E64ZPa0tQnswrXR21V98");'></div>
            
            <!-- Mobile Menu Toggle -->
            <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 text-slate-500 hover:text-primary transition-colors">
                <span class="material-symbols-outlined !text-3xl" x-show="!mobileMenuOpen">menu</span>
                <span class="material-symbols-outlined !text-3xl" x-show="mobileMenuOpen" x-cloak>close</span>
            </button>
        </div>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div x-show="mobileMenuOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-4"
         class="md:hidden absolute top-full left-0 w-full bg-surface/95 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 py-6 px-6 flex flex-col gap-4 shadow-2xl z-40"
         x-cloak>
        <a class="text-base font-semibold py-2 border-b border-slate-100/10 hover:text-primary transition-colors {% if request.resolver_match.url_name == 'home' %}text-primary{% endif %}" href="{% url 'home' %}" @click="mobileMenuOpen = false">Home</a>
        <a class="text-base font-semibold py-2 border-b border-slate-100/10 hover:text-primary transition-colors {% if request.resolver_match.url_name == 'about' %}text-primary{% endif %}" href="{% url 'about' %}" @click="mobileMenuOpen = false">About</a>
        <a class="text-base font-semibold py-2 border-b border-slate-100/10 hover:text-primary transition-colors {% if request.resolver_match.url_name == 'experience' %}text-primary{% endif %}" href="{% url 'experience' %}" @click="mobileMenuOpen = false">Experience</a>
        <a class="text-base font-semibold py-2 border-b border-slate-100/10 hover:text-primary transition-colors {% if request.resolver_match.url_name == 'blog' %}text-primary{% endif %}" href="{% url 'blog' %}" @click="mobileMenuOpen = false">Blog</a>
        <a class="text-base font-semibold py-2 border-b border-slate-100/10 hover:text-primary transition-colors {% if request.resolver_match.url_name == 'contact' %}text-primary{% endif %}" href="{% url 'contact' %}" @click="mobileMenuOpen = false">Contact</a>
        <div class="pt-4 flex items-center gap-4">
            <a href="{% url 'contact' %}" class="w-full text-center py-3 bg-primary text-white font-bold rounded-lg shadow-lg shadow-primary/20 transition-all">
                Hire Me
            </a>
        </div>
    </div>
</header>
