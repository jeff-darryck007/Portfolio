{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Posts</h1>
<table class="min-w-full bg-white dark:bg-gray-800">
<thead><tr><th class="px-4 py-2">Title</th><th class="px-4 py-2">Published</th></tr></thead>
<tbody>
{% for post in object_list %}
<tr class="border-t">
<td class="px-4 py-2">{{ post.title }}</td>
<td class="px-4 py-2">{{ post.is_published|yesno:"Yes,No" }}</td>
</tr>
{% empty %}
<tr><td colspan="2" class="px-4 py-2">No posts.</td></tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
