{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Skills</h1>
<table class="min-w-full bg-white dark:bg-gray-800">
<thead><tr><th class="px-4 py-2">Name</th><th class="px-4 py-2">Proficiency</th></tr></thead>
<tbody>
{% for skill in object_list %}
<tr class="border-t">
<td class="px-4 py-2">{{ skill.name }}</td>
<td class="px-4 py-2">{{ skill.proficiency }}%</td>
</tr>
{% empty %}
<tr><td colspan="2" class="px-4 py-2">No skills.</td></tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
