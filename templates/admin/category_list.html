{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Categories</h1>
<table class="min-w-full bg-white dark:bg-gray-800">
<thead><tr><th class="px-4 py-2">Name</th></tr></thead>
<tbody>
{% for category in object_list %}
<tr class="border-t">
<td class="px-4 py-2">{{ category.name }}</td>
</tr>
{% empty %}
<tr><td class="px-4 py-2">No categories.</td></tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
